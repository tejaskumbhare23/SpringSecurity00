<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <style>

            margin: 0;

        }

        .access-denied {

        .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h2 {
            color: #dc3545;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            font-size: 16px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;

            background-color: #007bff;

            text-decoration: none;
            border-radius: 5px;
        }

        .back-btn:hover {
            background-color: #0056b3;
        }

<body>

    <div class="access-denied">

        <div class="icon">🚫</div>

        <h2>Access Denied</h2>
